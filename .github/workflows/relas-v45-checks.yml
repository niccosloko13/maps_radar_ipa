name: RELAS 4.5 radar weather dashboard validation
on:
  push:
    branches:
      - feat/relas-radar-weather-dashboard-v45
  pull_request:
    branches:
      - feat/navigation-v3-phase-b1
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript source
        run: |
          node --check app/app.js
          node --check app/boot.js
          node --check app/ui/forecast.js
          node --check app/ui/radar-audit.js
      - name: Check offline audit script syntax
        run: |
          python -m py_compile tools/radar_quality_report.py tools/stage_external_sources.py
          python -m unittest discover -s tests -p 'test_relas_motion_icons.py'
          python -m unittest discover -s tests -p 'test_stage_external_sources.py'
      - name: Execute radar and navigation tests
        run: |
          node --test tests/radar-audit.test.cjs tests/forecast.test.cjs tests/navigation-arrival.test.js tests/drive-simulator.test.cjs
