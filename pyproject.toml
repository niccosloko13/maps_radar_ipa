[project]
name = "relas"
version = "2.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.3",
  "starlette==1.0.0",
  "pydantic==2.12.5",
  "uvicorn==0.41.0",
  "psycopg[binary]==3.3.3",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = ["httpx==0.28.1"]

[tool.vercel]
entrypoint = "server:app"

[tool.pytest.ini_options]
norecursedirs = ["artifacts", ".git", ".vercel", "node_modules"]
